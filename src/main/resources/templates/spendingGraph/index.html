<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>支出グラフ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/output.css">
</head>
<body class="bg-gray-100 min-h-screen">

<div class="max-w-5xl mx-auto p-6">

    <!-- タイトル -->
    <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">
        <span th:text="${year} + '年 ' + ${month} + '月の支出グラフ'">支出グラフ</span>
    </h2>

    <!-- ✅ 支出サマリー -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="bg-white shadow-md rounded-xl p-5 text-center">
            <h3 class="text-sm text-gray-500 font-medium mb-1">月の予算</h3>
            <p class="text-2xl font-bold text-blue-600"
               th:text="${#numbers.formatInteger(budgetAmount, 0, 'COMMA')} + '円'">0円</p>
        </div>

        <div class="bg-white shadow-md rounded-xl p-5 text-center">
            <h3 class="text-sm text-gray-500 font-medium mb-1">支出合計</h3>
            <p class="text-2xl font-bold text-gray-800"
               th:text="${#numbers.formatInteger(monthlyTotal, 0, 'COMMA')} + '円'">0円</p>
        </div>

        <div class="bg-white shadow-md rounded-xl p-5 text-center"
             th:classappend="${remainingBudget < 0} ? 'border-red-400 bg-red-50' : 'border-green-400 bg-green-50'">
            <h3 class="text-sm text-gray-500 font-medium mb-1">残り予算</h3>
            <p class="text-2xl font-bold"
               th:classappend="${remainingBudget < 0} ? 'text-red-600' : 'text-green-600'"
               th:text="${#numbers.formatInteger(remainingBudget, 0, 'COMMA')} + '円'">0円</p>
        </div>
    </div>

    <!-- ✅ 支出データがない場合 -->
    <div th:if="${#lists.isEmpty(graphData)}"
         class="bg-white p-6 rounded-lg shadow text-center text-gray-500">
        この月に支出は存在しません
    </div>

    <!-- ✅ 支出データがある場合 -->
    <div th:if="${!#lists.isEmpty(graphData)}"
         class="bg-white p-6 rounded-lg shadow flex flex-col md:flex-row items-center justify-center gap-4 md:gap-6">

        <!-- 円グラフ -->
        <div class="flex-shrink-0">
            <canvas id="spendingPieChart" class="w-[380px] h-[380px] md:w-[400px] md:h-[400px]"></canvas>
        </div>

        <!-- カテゴリ別割合リスト -->
        <div id="categoryRatioList" class="text-sm text-gray-700 w-full md:w-[250px] md:ml-1"></div>

    </div>

    <!-- ✅ カレンダーに戻るボタン -->
    <div class="mt-8 text-center">
        <a th:href="@{'/calendar/' + ${year} + '/' + ${month}}"
           class="bg-blue-500 text-white px-6 py-2 rounded-lg shadow hover:bg-blue-600 transition">
           カレンダーに戻る
        </a>
    </div>

</div>

<!-- ✅ グラフ描画スクリプト -->
<script th:inline="javascript">
/*<![CDATA[*/
const graphData = /*[[${graphData}]]*/ [];

if (graphData.length > 0) {
    const labels = graphData.map(item => item.categoryName);
    const data = graphData.map(item => item.totalAmount);
    const total = data.reduce((sum, val) => sum + val, 0);

    const ctx = document.getElementById('spendingPieChart').getContext('2d');
    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                backgroundColor: [
                    '#60A5FA', // blue
                    '#34D399', // green
                    '#FBBF24', // yellow
                    '#F87171', // red
                    '#A78BFA', // purple
                    '#F472B6'  // pink
                ],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const percent = ((context.raw / total) * 100).toFixed(1);
                            return `${context.label}: ${context.raw.toLocaleString()}円 (${percent}%)`;
                        }
                    }
                }
            }
        }
    });

    // ✅ カテゴリ割合リスト（より詰めたデザイン）
    const listContainer = document.getElementById('categoryRatioList');
    let html = '<h3 class="text-lg font-semibold mb-2 text-gray-800 text-center md:text-left">カテゴリ別割合</h3>';
    html += '<ul class="space-y-1">'; // ← 行間も詰める
    labels.forEach((label, i) => {
        const percent = ((data[i] / total) * 100).toFixed(1);
        const amount = data[i].toLocaleString();
        html += `
            <li class="flex items-center justify-between border-b pb-0.5">
                <span class="flex items-center gap-1">
                    <span class="w-3 h-3 inline-block rounded-full" 
                          style="background-color:${['#60A5FA','#34D399','#FBBF24','#F87171','#A78BFA','#F472B6'][i % 6]}"></span>
                    <span class="text-[13px]">${label}</span>
                </span>
                <span class="font-medium text-right min-w-[80px] leading-tight">
                    ${percent}%<br><span class="text-gray-500 text-[11px]">${amount}円</span>
                </span>
            </li>
        `;
    });
    html += '</ul>';
    listContainer.innerHTML = html;
}
/*]]>*/
</script>

</body>
</html>
