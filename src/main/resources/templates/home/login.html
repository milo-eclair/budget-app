<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <link rel="stylesheet" href="/css/output.css">
</head>
<body class="bg-gradient-to-r from-blue-100 via-blue-50 to-white flex items-center justify-center min-h-screen">

    <!-- ログインカード -->
    <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md transform transition-transform duration-300 hover:scale-105">
        
        <!-- ログインタイトル -->
        <h1 class="text-5xl font-extrabold text-center text-gray-800 mb-8">ログイン</h1>

        <!-- エラー表示 -->
        <span th:if="${param.error}" class="block text-red-500 text-center mb-6 font-semibold">
            ユーザ名またはパスワードが間違っています
        </span>

        <!-- フォーム -->
        <form method="post" th:action="@{/login}" class="space-y-6">

            <div>
                <label for="username" class="block text-gray-700 font-medium mb-2">ユーザー名</label>
                <input id="username" type="text" name="username" placeholder="ユーザー名"
                       class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition-colors"/>
            </div>

            <div>
                <label for="password" class="block text-gray-700 font-medium mb-2">パスワード</label>
                <input id="password" type="password" name="password" placeholder="パスワード"
                       class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition-colors"/>
            </div>

            <button type="submit"
                    class="w-full bg-blue-500 text-white font-bold py-3 rounded-lg hover:bg-blue-600 active:bg-blue-700 shadow-md transition-colors duration-200">
                ログイン
            </button>
        </form>

        <!-- 新規登録リンク -->
        <p class="text-center text-gray-600 text-sm mt-6">
            アカウントをお持ちでない場合
            <a th:href="@{/signin}" class="text-blue-500 font-semibold hover:underline">新規登録</a>
        </p>

    </div>
</body>
</html>
