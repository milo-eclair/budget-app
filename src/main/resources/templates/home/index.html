<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>ホーム</title>
    <link rel="stylesheet" href="/css/output.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- ホームタイトル -->
    <h1 class="text-4xl font-bold text-gray-800 mb-6">ホーム</h1>

    <!-- ログアウト完了メッセージ -->
    <span th:if="${param.logout}" class="text-green-500 mb-4 block text-center">
        ログアウトが完了しました
    </span>

    <!-- 非認証ユーザー向けリンク -->
    <div sec:authorize="isAnonymous()" class="flex space-x-4 mb-6">
        <a th:href="@{/login}"
           class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors duration-200">
            ログイン
        </a>
        <a th:href="@{/signin}"
           class="px-4 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400 transition-colors duration-200">
            サインイン
        </a>
    </div>

    <!-- ログイン済みユーザー向けメニュー -->
    <div sec:authorize="isAuthenticated()" class="bg-white p-6 rounded-lg shadow-md w-full max-w-sm text-center">
        <p class="text-gray-700 font-semibold mb-4">操作メニュー:</p>
        <ul class="space-y-2 mb-4">
            <li>
                <a th:href="@{/budget}"
                   class="block px-4 py-2 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition-colors duration-200">
                    予算管理
                </a>
            </li>
            <li>
                <a th:href="@{/spending}"
                   class="block px-4 py-2 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition-colors duration-200">
                    支出管理
                </a>
            </li>
            <li>
                <a th:href="@{/schedule}"
                   class="block px-4 py-2 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition-colors duration-200">
                    予定管理
                </a>
            </li>
        </ul>

        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    class="w-full bg-red-500 text-white font-bold py-2 rounded hover:bg-red-600 transition-colors duration-200">
                ログアウト
            </button>
        </form>
    </div>

</body>
</html>
